# ============================================================
#  SOCIAL TREND PIPELINE v2 - cấu hình
#  Sửa file này là đủ, không cần đụng vào code.
# ============================================================

db_path: data/pipeline.db
download_dir: downloads
log_file: logs/pipeline.log

# ---------- 1. TỪ KHOÁ ----------
# Mẹo: đặt từ khoá bằng TIẾNG TRUNG cho Douyin/1688 sẽ ra kết quả gấp 10 lần.
topics:
  - 颈椎按摩仪            # máy massage cổ
  - 厨房好物              # đồ gia dụng nhà bếp
  - 露营装备              # đồ cắm trại
  - máy massage cổ
  - đồ gia dụng thông minh

results_per_keyword: 30
top_n_per_run: 20            # số video tối đa đưa vào hàng đợi mỗi lần chạy
max_per_author: 2            # chống 1 kênh chiếm hết top

# ---------- 2. NGUỒN ----------
enabled_providers:
  douyin: true
  tiktok: true
  youtube: true
  1688: false
  reddit: true
  instagram: true
  discord: true

providers:
  douyin:
    backends: [f2, opencli, dtk]
    dtk_base_url: http://127.0.0.1:8080
    dtk_token: ""
    douyin_cookie: ""
    proxy: null
    sleep_range: [2.0, 5.0]

  tiktok:
    backends: [f2, dtk]
    tiktok_cookie: ""
    proxy: null
    sleep_range: [1.5, 4.0]

  1688:
    min_sold: 300            # bỏ qua sản phẩm bán dưới 300 đơn
    timeout: 240

  youtube: {}

  # Reddit discovery: OpenCLI -> metadata -> yt-dlp tải file.
  reddit:
    max_results: 30
    timeout: 120

  # Instagram discovery theo hashtag. Không lưu password trong file này.
  # Tạo/đặt session cục bộ rồi điền username + đường dẫn session vào đây.
  # Chỉ những topic có trong topic_hashtags mới được quét, tránh hashtag sai nghĩa.
  instagram:
    session_user: ""
    session_file: ""
    max_per_hashtag: 20
    use_topic_as_hashtag: true
    topic_hashtags:
      "máy massage cổ": ["neckmassager", "neckmassage", "颈按摩器"]
      "đồ gia dụng thông minh": ["kitchenhack", "homegadgets", "厨房好物"]
      "đồ cắm trại": ["camping", "campinggear", "露营装备"]

  # Discord discovery từ attachments trong channels. Cần bot token hoặc user token.
  discord:
    bot_token: ""
    user_token: ""
    channel_ids: []
    max_messages: 100

  # Reddit API credentials (lấy từ https://www.reddit.com/prefs/apps)
  # Có thể dùng read-only mode không cần auth nhưng bị giới hạn rate limit
  reddit:
    client_id: ""
    client_secret: ""
    user_agent: "VideoPipelineBot/1.0"
    username: ""
    password: ""
    subreddits: ["videos", "Shorts", "TikTokCringe", "funny", "gaming"]
    limit_per_subreddit: 30
    sort_by: "hot"              # hot, new, top
    time_filter: "week"         # hour, day, week, month, year, all

  # Facebook Graph API - Lấy từ https://developers.facebook.com
  # Cần access token với permissions: pages_read_engagement, groups_access_member
  facebook:
    access_token: ""
    app_id: ""
    app_secret: ""
    pages: []                   # Danh sách Page IDs cần quét
    groups: []                  # Danh sách Group IDs cần quét
    limit_per_source: 30
    use_scraper: true           # Dùng scraper thay thế khi không có API

# ---------- 3. LỌC THÔ (trước khi tốn băng thông) ----------
filters:
  min_views: 0
  min_likes: 0
  min_duration: 3
  max_duration: 300
  max_age_hours: 8760
  blocklist_keywords: []
  require_any_keywords: []

# ---------- 4. CHẤM ĐIỂM ----------
weights:
  reach: 0.20                # quy mô view (log)
  engagement: 0.25           # like + 3*comment + 5*share
  save: 0.20                 # lượt lưu -> tín hiệu ý định mua mạnh nhất
  freshness: 0.15
  velocity: 0.20             # view tăng/giờ giữa 2 lần crawl

engagement_ceiling: 0.25
save_rate_ceiling: 0.05
freshness_halflife_hours: 72

platform_boost:
  douyin: 1.15               # video gốc TQ thường là bản chất lượng nhất
  tiktok: 1.00
  1688: 0.95
  youtube: 0.85

# ---------- 5. TẢI VIDEO ----------
download:
  ytdlp_format: "bv*[height<=1080]+ba/b[height<=1080]/b"
  timeout: 300
  max_attempts: 3
  delay_seconds: 2
  cookies_from_browser: ""
  cookies_file: ""
  f2_config: ""                  # đường dẫn tới file config f2 nếu dùng fallback f2
  proxy: null

# ---------- 6. CỔNG CHẤT LƯỢNG ----------
qc:
  require_audio: false          # Đã tắt theo yêu cầu: chấp nhận cả video không tiếng / chỉ có OCR
  min_height: 720              # Nâng lên 720p để đảm bảo chất lượng hình ảnh cao
  min_duration: 8
  check_phash: true            # Chống trùng nội dung video
  phash_distance: 6
  check_speech: false          # Tắt kiểm tra tiếng nói
  min_speech_ratio: 0.0

# ---------- 7. CẦU NỐI AUTODUB ----------
bridge:
  staging_dir: outputs/to_autodub
  dubbed_dir: outputs/dubbed
  rclone_remote: ""            # Để trống: không cần đẩy đi đâu cả
  require_qc: false
  auto_export: false           # Tắt tự động export
  upload_timeout: 3600
